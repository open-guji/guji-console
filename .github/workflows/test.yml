name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: guji-console
      # 控制台测试借 cv 仓的测试设施与冻结数据（tests/conftest.py），cv 要源码安装在旁边
      - uses: actions/checkout@v4
        with:
          repository: open-guji/open-guji-cv
          ref: dev
          path: open-guji-cv
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install uv
      - run: uv pip install --system -e "./open-guji-cv[dev]" -e "./guji-console[dev]"
      - run: python -m pytest -q -p no:cacheprovider -n auto
        working-directory: guji-console
