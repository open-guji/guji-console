name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cv_ref:
        description: 'open-guji-cv 的分支（默认 dev）'
        default: dev

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: guji-console
      # 控制台测试借 cv 仓的测试设施与冻结数据（tests/conftest.py），cv 要源码安装在旁边
      - uses: actions/checkout@v4
        with:
          repository: open-guji/open-guji-cv
          ref: ${{ inputs.cv_ref || 'dev' }}
          path: open-guji-cv
          lfs: false
      # 控制台门面 console_api 在 guji-manager（拆分 P6，2026-11-04；manager ≥0.4.0），审阅卡片、评测等也在那边
      - uses: actions/checkout@v4
        with:
          repository: open-guji/guji-manager
          ref: main
          path: guji-manager
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install uv
      - run: uv pip install --system -e "./open-guji-cv[dev]" -e "./guji-manager" -e "./guji-console[dev]"
      - run: python -m pytest -q -p no:cacheprovider -n auto
        working-directory: guji-console
        env:
          # cv 的 conftest 开跑前从 R2 取钉死的模型／字体／底库语料（cv v0.7.0 起模型不在 git 里），要中心库读令牌。
          # 值同 guji-dev-secret 里的 GUJI_DATA_TOKEN_READ，由 Ops 设成本仓 Actions secret。
          GUJI_DATA_TOKEN_READ: ${{ secrets.GUJI_DATA_TOKEN_READ }}
          GUJI_FETCH_MIN_FREE_GB: "1"   # 托管 runner 盘小，同 guji-manager 的 test.yml
